; FlapFC board test firmware - PlatformIO project (macOS / Linux / Windows)
;
;   pio run                      build
;   pio run -t upload            flash with an ST-Link (SWD pads on the back of the board)
;   pio run -e dfu -t upload     flash over USB: hold BOOT, tap RESET, release BOOT first
;   pio device monitor           open the console (USB virtual COM port)
;
; ST's HAL, CMSIS, startup code and USB device library come from PlatformIO's STM32Cube
; framework package; this repository only holds the application sources.

[platformio]
default_envs = stlink

[env]
platform = ststm32
framework = stm32cube
board = genericSTM32F446RE
; use include/stm32f4xx_hal_conf.h (8 MHz crystal, only the HAL modules this firmware needs)
board_build.stm32cube.custom_config_header = yes
; ST's linker script plus a .noinit section (keeps the "enter bootloader" flag across a reset)
board_build.ldscript = STM32F446RE.ld
build_flags =
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -Wl,-u,_printf_float
extra_scripts = pre:link_flags.py
monitor_speed = 115200

[env:stlink]
upload_protocol = stlink
debug_tool = stlink

[env:dfu]
upload_protocol = dfu
